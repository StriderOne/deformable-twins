id: P-0008
version: 1
status: proposal
experiment: E-0013
independent_unit: single_recording_double_lift_sloth
splits:
  initialization_frame: 0
  calibration_targets:
  - 1
  - 43
  continuation_targets:
  - 43
  - 62
  interval_convention: half_open
  independent_validation: null
  independent_test: null
  real_world_evaluation: null
  continuation_is_independent: false
primary_metric:
  name: pairwise_per_spring_physical_mean_and_std_ratio
  std_ratio_threshold: 0.8
  units: fraction
  prerequisite: finite_training_and_predictive_quality_inspected
  interpretation: Descriptive diversity across joint seed and median changes
  coordinates: physical_stiffness_Y_before_clamp
secondary_metrics:
- tracking_rmse_m_per_coordinate
- tracking_nll_without_constant
- kl_q_prior
- posterior_std_log_stiffness
- controller_spring_std_ratio
- fraction_stiffness_at_or_outside_simulator_bounds
- wall_seconds
- peak_process_gpu_memory_mib
uncertainty:
  method: logistic_normal_posterior_predictive_samples
  prior: uniform_physical_stiffness
  metrics: physical_mean_std_and_quantiles; do_not_use_latent_std_as_physical_uncertainty
  convergence: fixed_budget_does_not_establish_convergence
  limitations:
  - truncated_gradient
  - bounded_variational_family
  - finite_uniform_bounds
  - CMA_initialization
  - single_session
  - no_independent_test
comparison:
  aggregation:
  - pairwise_mean_absolute_difference_Y
  - pairwise_mean_absolute_difference_std_ratio
  - per_spring_range_Y
  - per_spring_std_across_runs_Y
  evaluation: fixed parameters for each full trajectory; fixed evaluation seed for
    all checkpoints and runs
  stopping: fixed passes or declared time budget; retain failures
  acceptance_threshold: null
failures:
  nonfinite: stop_before_optimizer_step_and_record_first_bad_frame; fast_path_checks_after_rollout
  timeout: save_last_completed_iteration_and_mark_budget_limited
  missing_observations: mask_out_no_imputation
  no_valid_training_coordinates: fail
  raw_results: never_overwrite_finished_runs
safety: offline_simulation_only_no_robot
