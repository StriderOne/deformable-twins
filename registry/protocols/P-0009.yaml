id: P-0009
version: 1
status: proposal
experiment: E-0014
independent_unit: single_recording_double_lift_sloth
splits:
  initialization_frame: 0
  calibration_targets:
  - 1
  - 43
  continuation_targets:
  - 43
  - 62
  interval_convention: half_open
  independent_validation: null
  independent_test: null
  real_world_evaluation: null
  continuation_is_independent: false
primary_metric:
  name: joint_parameter_and_prediction_pairwise_distances
  std_ratio_threshold: 0.8
  units: log_stiffness_RMS_and_meters
  interpretation: exploratory_no_success_threshold_no_mode_count
secondary_metrics:
- tracking_rmse_m_per_coordinate
- tracking_nll_without_constant
- kl_q_prior
- posterior_std_log_stiffness
- controller_spring_std_ratio
- fraction_stiffness_at_or_outside_simulator_bounds
- wall_seconds
- peak_process_gpu_memory_mib
uncertainty:
  method: 32_fixed_joint_flow_samples
  prior: uniform_physical_stiffness
  metrics: physical_mean_std_and_quantiles; do_not_use_latent_std_as_physical_uncertainty
  convergence: fixed_budget_does_not_establish_convergence
  limitations:
  - truncated_gradient
  - bounded_variational_family
  - finite_uniform_bounds
  - CMA_initialization
  - single_session
  - no_independent_test
  - single_seed
  - stochastic_logdet
  - framewise_parameter_changes
  - initial_graph_architecture
  - existing_control_has_different_training_budget
comparison:
  aggregation:
  - object_and_controller_log_stiffness_RMS
  - all_particle_xyz_prediction_RMS_by_split
  - masked_tracking_RMSE_by_sample_and_split
  evaluation: fixed stiffness per complete trajectory
  stopping: one hour training, finish active pass; evaluation separate one hour cap
  acceptance_threshold: null
  baseline: existing BL-0010 samples evaluated with same metrics, descriptive only
  mode_claim: no clustering threshold or mode count inferred automatically
failures:
  nonfinite: stop_before_optimizer_step_and_record_first_bad_frame; fast_path_checks_after_rollout
  timeout: stop_at_complete_pass_boundary; crash resumes last complete checkpoint
  missing_observations: mask_out_no_imputation
  no_valid_training_coordinates: fail
  raw_results: never_overwrite_finished_runs
safety: offline_simulation_only_no_robot
